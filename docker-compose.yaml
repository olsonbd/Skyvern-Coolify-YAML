services:
  postgres:
    image: 'postgres:14-alpine'
    restart: always
    volumes:
      - './postgres-data:/var/lib/postgresql/data'
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=skyvern
      - POSTGRES_PASSWORD=skyvern
      - POSTGRES_DB=skyvern
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skyvern']
      interval: 5s
      timeout: 5s
      retries: 5

  skyvern:
    image: 'public.ecr.aws/skyvern/skyvern:latest'
    restart: on-failure
    ports:
      - '8088:8000'
      - '9222:9222'
    volumes:
      - './artifacts:/data/artifacts'
      - './videos:/data/videos'
      - './har:/data/har'
      - './log:/data/log'
      - './.streamlit:/app/.streamlit'
    environment:
      - DATABASE_STRING=postgresql+psycopg://skyvern:skyvern@postgres:5432/skyvern
      - BROWSER_TYPE=chromium-headful
      - ENABLE_CODE_BLOCK=true
      - VITE_ENABLE_CODE_BLOCK=true
      # Provide literal values or leave these; they can be empty if not needed.
      - LLM_KEY=${LLM_KEY}
      - SECONDARY_LLM_KEY=${SECONDARY_LLM_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENABLE_GEMINI=${ENABLE_GEMINI}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SKYVERN_API_KEY=${SKYVERN_API_KEY}
      - API_DOMAIN=${API_DOMAIN}
      - ARTIFACT_DOMAIN=${ARTIFACT_DOMAIN}
      # IMPORTANT: Skyvern should call the CLI service on the Docker network
      - BITWARDEN_SERVER=http://bitwarden-cli:8087
      # Remove Compose-time interpolation for these; set them in Coolify env for the skyvern container:
      # SKYVERN_AUTH_BITWARDEN_CLIENT_ID
      # SKYVERN_AUTH_BITWARDEN_CLIENT_SECRET
      # SKYVERN_AUTH_BITWARDEN_MASTER_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/app/.streamlit/secrets.toml']
      interval: 5s
      timeout: 5s
      retries: 5

  skyvern-ui:
    image: 'public.ecr.aws/skyvern/skyvern-ui:latest'
    restart: on-failure
    ports:
      - '8888:8080'
      - '9090:9090'
    volumes:
      - './artifacts:/data/artifacts'
      - './videos:/data/videos'
      - './har:/data/har'
      - './.streamlit:/app/.streamlit'
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_WSS_BASE_URL=${VITE_WSS_BASE_URL}
      - VITE_ARTIFACT_API_BASE_URL=${VITE_ARTIFACT_API_BASE_URL}
      - VITE_ENVIRONMENT=${VITE_ENVIRONMENT}
      - VITE_SKYVERN_API_KEY=${VITE_SKYVERN_API_KEY}
    depends_on:
      skyvern:
        condition: service_healthy

  vaultwarden:
    image: 'vaultwarden/server:latest-alpine'
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: 'https://vaultwarden.points.place'
      SIGNUPS_ALLOWED: 'false'
      # Remove BW_* here; vaultwarden doesn't use them.
    volumes:
      - '~/vw-data/:/data/'
    ports:
      - '127.0.0.1:11002:80'

  bitwarden-cli:
    image: 'ghcr.io/olsonbd/bitwarden-cli:latest'
    restart: unless-stopped
    ports:
      - '127.0.0.1:8002:8087'
    environment:
      # IMPORTANT: talk to vaultwarden via service DNS, not localhost
      - BW_HOST=http://vaultwarden
      # Do NOT interpolate here; set these three in Coolify for this service:
      # BW_CLIENTID
      # BW_CLIENTSECRET
      # BW_PASSWORD
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8087/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      vaultwarden:
        condition: service_healthy
    volumes:
      - '~/bitwarden-cli-config:/app/.config'
    labels:
      - traefik.enable=false
